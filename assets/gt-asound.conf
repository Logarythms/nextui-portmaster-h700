# gt-asound.conf — F47: route the port's "default" PCM through the pak's
# suspend-proxy plugin so audio survives suspend-to-RAM (the BSP wedges any
# PCM open across a suspend; only close+reopen recovers — see
# docs/h700-fixes.md F47). pcm.gt_stock_hooks is a verbatim copy of NextUI's
# stock /etc/asound.conf default chain (drift risk documented in F47 notes).
# NOTE: the "gt_suspend" name below is NOT cosmetic — alsa-lib's pcm_type
# dlopen path looks up the symbol _snd_pcm_gt_suspend_open, so this name
# must equal the argument to the plugin's SND_PCM_PLUGIN_SYMBOL(gt_suspend)
# (assets/gt-alsa-suspend.c). Renaming one without the other breaks the load.
#
# This file is deliberately SELF-CONTAINED — it must NOT include
# /usr/share/alsa/alsa.conf: alsa.conf's @hooks node loads /etc/asound.conf
# only AFTER the entire ALSA_CONFIG_PATH file is parsed, so the stock
# pcm.!default would clobber any override we write here (device-proven).
# Instead this file defines everything a port's ALSA client needs: the
# ctl.hw stanza (used by the ctl_elems hook, which alsa.conf normally
# provides), the stock output chain copy, and pcm.default routed through
# the suspend-proxy plugin.

ctl.hw {
    @args [ CARD ]
    @args.CARD { type string default 0 }
    type hw
    card $CARD
}

pcm_type.gt_suspend {
    lib "@PAK_DIR@/lib/libasound_module_pcm_gt_suspend.so"
}

pcm.gt_stock_hooks {
    type hooks
    slave.pcm { type hw card audiocodec }
    hooks.0 {
        type ctl_elems
        hook_args [
            { name "LINEOUT Switch" preserve true lock true value 1 }
            { name "SPK Switch" preserve true lock true value 1 }
            { name "OutputL Mixer DACL Switch" preserve true lock true value 1 }
            { name "OutputR Mixer DACR Switch" preserve true lock true value 1 }
            { name "digital volume" preserve true lock true value 63 }
        ]
    }
}

pcm.gt_stock_slave {
    type plug
    slave.pcm "gt_stock_hooks"
}

pcm.default {
    type gt_suspend
    slave.pcm "gt_stock_slave"
    # F55: alsa-lib's snd_device_name_hint() — what SDL2's ALSA backend uses to
    # enumerate output devices — lists ONLY pcm nodes that carry a hint{} block
    # (a global alsa-lib default can force every pcm to show, but this
    # self-contained file never sets it). Without it SDL saw zero audio devices and
    # the EDuke32 family (Duke 3D, Blood, Redneck Rampage, PowerSlave) crashed on
    # strdup(SDL_GetAudioDeviceName(0,0)) = NULL from 0.4.0 on (issue #1).
    # Device-proven 2026-09-04: aplay -L listed nothing, then exactly "default",
    # still routed through gt_suspend. SDL falls back to the device literally
    # named "default", so this one hint is sufficient.
    hint {
        show on
        description "NextUI default output (sleep-safe)"
    }
}
